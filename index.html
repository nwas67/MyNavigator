function findLocation() {

    if (!navigator.geolocation) {

        alert(
            "Геолокация не поддерживается"
        );

        return;
    }

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;

            currentLocation = {

                lat: lat,

                lon: lon

            };

            map.setView(
                [lat, lon],
                16
            );

            if (marker) {

                map.removeLayer(
                    marker
                );

            }

            marker =
                L.marker(
                    [lat, lon]
                )
                .addTo(map)
                .bindPopup(
                    "Вы здесь"
                )
                .openPopup();

            map.invalidateSize(
                true
            );

        },

        function() {

            alert(
                "Не удалось определить местоположение"
            );

        }

    );

}

let marker = null;

let currentLocation = null;

let destination = null;

let routeLine = null;

let searchTimer = null;

/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const searchInput =
    document.getElementById("search");

const results =
    document.getElementById("results");

const clearButton =
    document.getElementById("clearButton");

const destinationTitle =
    document.getElementById("destinationTitle");

const routeButton =
    document.getElementById("routeButton");

const routeInfo =
    document.getElementById("routeInfo");

const routeTime =
    document.getElementById("routeTime");

const routeDistance =
    document.getElementById("routeDistance");

/* =====================================================
   ПОИСК
===================================================== */

searchInput.addEventListener(
    "input",
    function() {

        clearTimeout(searchTimer);

        const query =
            searchInput.value.trim();

        clearButton.style.display =
            query.length > 0
            ? "block"
            : "none";

        if (query.length < 3) {

            results.innerHTML = "";

            return;
        }

        searchTimer =
            setTimeout(
                function() {
                    searchPlace(query);
                },
                500
            );

    }
);

/* =====================================================
   ПОИСК АДРЕСА
===================================================== */

async function searchPlace(query) {

    try {

        const url =
            "https://nominatim.openstreetmap.org/search" +
            "?format=json" +
            "&limit=5" +
            "&q=" +
            encodeURIComponent(query);

        const response =
            await fetch(url);

        const places =
            await response.json();

        results.innerHTML = "";

        places.forEach(function(place) {

            const item =
                document.createElement("div");

            item.className =
                "result";

            const icon =
                document.createElement("div");

            icon.className =
                "result-icon";

            icon.textContent =
                "📍";

            const text =
                document.createElement("div");

            text.textContent =
                place.display_name;

            item.appendChild(icon);

            item.appendChild(text);

            item.onclick =
                function() {

                    const lat =
                        parseFloat(place.lat);

                    const lon =
                        parseFloat(place.lon);

                    destination = {

                        lat: lat,

                        lon: lon,

                        name:
                            place.display_name

                    };

                    map.setView(
                        [lat, lon],
                        16
                    );

                    if (marker) {

                        map.removeLayer(
                            marker
                        );

                    }

                    marker =
                        L.marker(
                            [lat, lon]
                        ).addTo(map);

                    searchInput.value =
                        place.display_name;

                    destinationTitle.textContent =
                        place.display_name;

                    routeButton.style.display =
                        "block";

                    results.innerHTML =
                        "";

                    map.invalidateSize(
                        true
                    );

                };

            results.appendChild(item);

        });

    } catch (error) {

        console.log(
            "Ошибка поиска:",
            error
        );

    }

}
