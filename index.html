<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Navigator</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
        }

        /* КАРТА — оставляем как в рабочей версии */
        #map {
            width: 100%;
            height: 100%;
        }

        /* ПОИСК */
        .top-panel {
            position: fixed;
            top: 18px;
            left: 15px;
            right: 15px;
            z-index: 9999;
        }

        .search-box {
            height: 58px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
        }

        .search-icon {
            font-size: 22px;
            margin-right: 12px;
        }

        .search-text {
            font-size: 18px;
            color: #777;
        }

        /* ГЕОЛОКАЦИЯ */
        #locationBtn {
            position: fixed;
            right: 18px;
            bottom: 140px;
            z-index: 9999;

            width: 56px;
            height: 56px;

            border: 0;
            border-radius: 50%;

            background: white;
            font-size: 25px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.22);
        }

        /* НИЖНЯЯ ПАНЕЛЬ */
        .bottom-panel {
            position: fixed;
            left: 12px;
            right: 12px;
            bottom: 12px;
            z-index: 9999;

            background: rgba(255, 255, 255, 0.96);
            border-radius: 24px;
            padding: 15px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
        }

        .panel-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .quick-buttons {
            display: flex;
            gap: 10px;
        }

        .quick-button {
            flex: 1;
            height: 55px;

            border: 0;
            border-radius: 17px;
            background: #f2f2f2;

            font-size: 15px;
        }

        .leaflet-control-zoom {
            display: none;
        }
    </style>
</head>

<body>

    <!-- КАРТА -->
    <div id="map"></div>

    <!-- ПОИСК -->
    <div class="top-panel">
        <div class="search-box">
            <div class="search-icon">🔍</div>
            <div class="search-text">Куда едем?</div>
        </div>
    </div>

    <!-- МОЁ МЕСТО -->
    <button id="locationBtn">📍</button>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="bottom-panel">
        <div class="panel-title">Быстрый доступ</div>

        <div class="quick-buttons">
            <button class="quick-button">🏠<br

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        /* КАРТА */
        const map = L.map("map").setView(
            [55.751244, 37.618423],
            10
        );

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);

        /* ГЕОЛОКАЦИЯ */
        let userMarker = null;

        document.getElementById("locationBtn").addEventListener("click", function () {

            if (!navigator.geolocation) {
                alert("Геолокация не поддерживается");

                    if (userMarker) {
                        userMarker.setLatLng([lat, lon]);
                    } else {
                        userMarker = L.marker([lat, lon])

                            .bindPopup("Вы здесь")

                    }
