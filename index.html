<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Navigator</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#map {
    width: 100%;
    height: 100%;
}

/* Поисковая панель */
.search-box {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;

    height: 55px;

    background: white;
    border-radius: 18px;

    z-index: 1000;

    display: flex;
    align-items: center;

    padding: 0 18px;

    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.search-icon {
    font-size: 21px;
    margin-right: 10px;
}

#search {
    width: 100%;
    height: 100%;

    border: none;
    outline: none;

    font-size: 17px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="search-box">

    <div class="search-icon">🔎</div>

    <input
        id="search"
        type="text"
        placeholder="Куда едем?"
    >

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView(
    [55.751244, 37.618423],
    10
);

L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution:
            "&copy; OpenStreetMap contributors"
    }
).addTo(map);

</script>

</body>
</html>
