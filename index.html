<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Navigator</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #map {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .search {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }

        #searchInput {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            box-shadow: 0 2px 10px #0004;
        }

        #searchButton {
            width: 55px;
            border: none;
            border-radius: 12px;
            background: white;
            font-size: 20px;
            box-shadow: 0 2px 10px #0004;
        }

        #locationButton {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            background: white;
            font-size: 16px;
            box-shadow: 0 2px 10px #0004;
        }

        #results {
            position: fixed;
            top: 70px;
            left: 15px;
            right: 15px;
            z-index: 1000;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        .result {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <div class="search">
        <input
            id="searchInput"
            type="text"
            placeholder="Куда едем?"
        >

        <button id="searchButton">🔍</button>
    </div>

    <div id="results"></div>

    <button id="locationButton">
        📍 Моё местоположение
    </button>

    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        console.log("My Navigator запускается");

        const map = L.map("map").setView(
            [55.751244, 37.618423],
            10
        );

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);

        console.log("Карта создана");

        let marker = null;

        const searchInput =
            document.getElementById("searchInput");

        const searchButton =
            document.getElementById("searchButton");

        const locationButton =
            document.getElementById("locationButton");

        const results =
            document.getElementById("results");

        searchButton.onclick = async function () {

            const query = searchInput.value.trim();

            if (!query) return;

            results.innerHTML = "Поиск...";

            try {

                const response = await fetch(
                    "https://nominatim.openstreetmap.org/search?format=json&limit=5&q="
                    + encodeURIComponent(query)
                );

                const data = await response.json();

                results.innerHTML = "";

                if (data.length === 0) {
                    results.innerHTML = "Ничего не найдено";
                    return;
                }

                data.forEach(function(place) {

                    const item =
                        document.createElement("div");

                    item.className =


ult";
                    item.textContent =
                        place.display_name;

                    item.onclick = function() {

                        const lat =
                            parseFloat(place.lat);

                        const lon =
                            parseFloat(place.lon);

                        map.setView(
                            [lat, lon],
                            16
                        );

                        if (marker) {
                            map.removeLayer(marker);
                        }

                        marker =
                            L.marker([lat, lon])
                            .addTo(map)
                            .bindPopup(
                                place.display_name
                            )
                            .openPopup();

                        results.innerHTML = "";
                    };

                    results.appendChild(item);
                });

            } catch (error) {

                console.error(error);

                results.innerHTML =
                    "Ошибка поиска";
            }
        };

        searchInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    searchButton.click();
                }

            }
        );

        locationButton.onclick = function() {

            if (!navigator.geolocation) {
                alert(
                    "Геолокация не поддерживается"
                );
                return;
            }

            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const lat =
                        position.coords.latitude;

                    const lon =
                        position.coords.longitude;

                    map.setView(
                        [lat, lon],
                        16
                    );

                    if (marker) {
                        map.removeLayer(marker);
                    }

                    marker =
                        L.marker([lat, lon])
                        .addTo(map)
                        .bindPopup("Вы здесь")
                        .openPopup();
                },

                function(error) {

                    console.error(error);

                    alert(
                        "Не удалось определить местоположение"
                    );
                }
            );
        };
    </script>

</body>
</html>
