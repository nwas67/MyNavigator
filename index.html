<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Navigator</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#map {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.search-box {
    position: fixed;
    top: 20px;
    left: 15px;
    right: 15px;
    z-index: 9999;
}

#search {
    width: 100%;
    box-sizing: border-box;
    padding: 16px 20px;
    border: none;
    border-radius: 18px;
    font-size: 18px;
    background: white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    outline: none;
}

#results {
    margin-top: 8px;
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.result {
    padding: 14px;
    border-bottom: 1px solid #ddd;
    font-size: 15px;
}

.result:last-child {
    border-bottom: none;
}

.location-button {
    position: fixed;
    right: 15px;
    bottom: 120px;
    z-index: 9999;
    width: 55px;
    height: 55px;
    border: none;
    border-radius: 50%;
    background: white;
    font-size: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
}
</style>
</head>

<body>

<div id="map"></div>

<div class="search-box">
    <input id="search" type="text" placeholder="Куда едем?">
    <div id="results"></div>
</div>

<button class="location-button" onclick="findLocation()">📍</button>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([55.751244, 37.618423], 10);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

let marker = null;

const searchInput = document.getElementById('search');
const results = document.getElementById('results');

let timer;

searchInput.addEventListener('input', function() {
    clearTimeout(timer);

    const query = this.value.trim();

    if (query.length < 3) {
        results.innerHTML = '';
        return;
    }

    timer = setTimeout(() => searchPlace(query), 500);
});

async function searchPlace(query) {
    try {
        const url =
            'https://nominatim.openstreetmap.org/search' +
            '?format=json&limit=5&q=' +
            encodeURIComponent(query);

        const response = await fetch(url);
        const data = await response.json();

        results.innerHTML = '';

        data.forEach(place => {
            const item = document.createElement('div');

            item.className = 'result';
            item.textContent = place.display_name;

            item.onclick = function() {
                const lat = parseFloat(place.lat);
                const lon = parseFloat(place.lon);

                map.setView([lat, lon], 16);

                if (marker) {
                    map.removeLayer(marker);
                }

                marker = L.marker([lat, lon]).addTo(map);

                searchInput.value = place.display_name;
                results.innerHTML = '';
            };

            results.appendChild(item);
        });

    } catch (error) {
        console.log(error);
    }
}

function findLocation() {
    if (!navigator.geolocation) {
        alert('Геолокация не поддерживается');
        return;
    }

    navigator.geolocation.getCurrentPosition(
        position => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            map.setView([lat, lon], 16);

            if (marker) {
                map.removeLayer(marker);
            }

            marker = L.marker([lat, lon])
                .addTo(map)
                .bindPopup('Вы здесь')
                .openPopup();
        },
        () => {
            alert('Не удалось определить местоположение');
        }
    );
}
</script>

</body>
</html>
