<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Navigator</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#map {
    width: 100%;
    height: 100%;
}

/* ПОИСК */
.search-box {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;
    z-index: 1000;
}

#search {
    width: 100%;
    box-sizing: border-box;
    padding: 16px 18px;
    border: none;
    border-radius: 18px;
    background: white;
    font-size: 17px;
    outline: none;
    box-shadow: 0 4px 18px rgba(0,0,0,0.20);
}

/* РЕЗУЛЬТАТЫ */
#results {
    position: fixed;
    top: 75px;
    left: 15px;
    right: 15px;
    z-index: 1000;
}

.result {
    padding: 14px 16px;
    margin-bottom: 7px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    font-size: 15px;
    cursor: pointer;
}

/* КНОПКА ГЕОЛОКАЦИИ */
.location-button {
    position: fixed;
    right: 15px;
    bottom: 25px;
    z-index: 1000;

    width: 55px;
    height: 55px;

    border: none;
    border-radius: 18px;

    background: white;
    font-size: 25px;

    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
}

/* КАРТОЧКА МАРШРУТА */
.route-panel {
    position: fixed;
    left: 15px;
    right: 15px;
    bottom: 15px;
    z-index: 1000;

    display: none;

    background: white;
    border-radius: 22px;
    padding: 18px;

    box-shadow: 0 5px 25px rgba(0,0,0,0.25);
}

.route-panel.show {
    display: block;
}

.route-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
}

.route-info {
    display: flex;
    gap: 20px;
    margin-bottom: 14px;
}

.route-info div {
    font-size: 16px;
    font-weight: 600;
}

.route-button {
    width: 100%;
    padding: 14px;

    border: none;
    border-radius: 15px;

    background: #222;
    color: white;

    font-size: 16px;
    font-weight: 600;
}

.route-button:active {
    transform: scale(0.98);
}
</style>
</head>

<body>

<div id="map"></div>

<div class="search-box">
    <input
        id="search"
        type="text"
        placeholder="Куда едем?"
        autocomplete="off"
    >
</div>

<div id="results"></div>

<button
    id="locationButton"
    class="location-button"
>
    📍
</button>

<div id="routePanel" class="route-panel">

    <div class="route-title">
        Маршрут
    </div>

    <div class="route-info">

        <div id="distance">
            📏 —
        </div>

        <div id="duration">
            🕐 —
        </div>

    </div>

    <button
        id="routeButton"
        class="route-button"
    >
        Построить маршрут
    </button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   КАРТА
========================= */

const map = L.map("map").setView(
    [55.751244, 37.618423],
    10
);

L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);

/* =========================
   ПЕРЕМЕННЫЕ
========================= */

const search =
    document.getElementById("search");

const results =
    document.getElementById("results");

const locationButton =
    document.getElementById("locationButton");

const routePanel =
    document.getElementById("routePanel");

const routeButton =
    document.getElementById("routeButton");

const distance =
    document.getElementById("distance");

const duration =
    document.getElementById("duration");

let marker = null;

let userMarker = null;

let routeLine = null;

let timer = null;

let userLocation = null;

let destination = null;

/* =========================
   ПОИСК
========================= */

search.addEventListener(
    "input",
    function() {

        clearTimeout(timer);

        const query =
            search.value.trim();

        if (query.length < 3) {

            results


nnerHTML = "";

            return;
        }

        timer = setTimeout(
            async function() {

                try {

                    const response =
                        await fetch(
                            "https://nominatim.openstreetmap.org/search" +
                            "?format=json" +
                            "&limit=5" +
                            "&q=" +
                            encodeURIComponent(query)
                        );

                    const data =
                        await response.json();

                    results.innerHTML = "";

                    data.forEach(
                        function(place) {

                            const item =
                                document.createElement(
                                    "div"
                                );

                            item.className =
                                "result";

                            item.textContent =
                                place.display_name;

                            item.addEventListener(
                                "click",
                                function() {

                                    const lat =
                                        Number(place.lat);

                                    const lon =
                                        Number(place.lon);

                                    destination = {
                                        lat: lat,
                                        lon: lon
                                    };

                                    map.setView(
                                        [lat, lon],
                                        15
                                    );

                                    if (marker) {
                                        map.removeLayer(
                                            marker
                                        );
                                    }

                                    marker =
                                        L.marker(
                                            [lat, lon]
                                        ).addTo(map);

                                    marker
                                        .bindPopup(
                                            place.display_name
                                        )
                                        .openPopup();

                                    search.value =
                                        place.display_name;

                                    results.innerHTML =
                                        "";

                                    routePanel.classList
                                        .add("show");

                                    distance.textContent =
                                        "📏 —";

                                    duration.textContent =
                                        "🕐 —";
                                }
                            );

                            results.appendChild(
                                item
                            );
                        }
                    );

                } catch (error) {

                    console.log(
                        "Ошибка поиска:",
                        error
                    );
                }

            },
            500
        );
    }
);

/* =========================
   ГЕОЛОКАЦИЯ
========================= */

locationButton.addEventListener(
    "click",
    function() {

        if (!navigator.geolocation) {

            alert(
                "Геолокация не поддерживается."
            );

            return;
        }

        locationButton.textContent =
            "⏳";

        navigator.geolocation.getCurrentPosition(

            function(position) {

                const lat =
                    position.coords.latitude;

                const lon =
                    position.coords.longitude;

                userLocation = {


lat: lat,
                    lon: lon
                };

                map.setView(
                    [lat, lon],
                    16
                );

                if (userMarker) {
                    map.removeLayer(
                        userMarker
                    );
                }

                userMarker =
                    L.marker(
                        [lat, lon]
                    ).addTo(map);

                userMarker
                    .bindPopup(
                        "📍 Вы здесь"
                    )
                    .openPopup();

                locationButton.textContent =
                    "📍";
            },

            function(error) {

                console.log(
                    "Ошибка геолокации:",
                    error
                );

                locationButton.textContent =
                    "📍";

                alert(
                    "Не удалось определить местоположение."
                );
            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }
);

/* =========================
   ПОСТРОЕНИЕ МАРШРУТА
========================= */

routeButton.addEventListener(
    "click",
    async function() {

        if (!userLocation) {

            alert(
                "Сначала нажми 📍 и разреши доступ к местоположению."
            );

            return;
        }

        if (!destination) {

            alert(
                "Сначала выбери место назначения."
            );

            return;
        }

        routeButton.textContent =
            "Строим маршрут...";

        try {

            const url =
                "https://router.project-osrm.org/route/v1/driving/" +

                userLocation.lon +
                "," +
                userLocation.lat +

                ";" +

                destination.lon +
                "," +
                destination.lat +

                "?overview=full&geometries=geojson";

            const response =
                await fetch(url);

            const data =
                await response.json();

            if (
                !data.routes ||
                data.routes.length === 0
            ) {

                throw new Error(
                    "Маршрут не найден"
                );
            }

            const route =
                data.routes[0];

            /* Удаляем старый маршрут */

            if (routeLine) {

                map.removeLayer(
                    routeLine
                );
            }

            /* Рисуем новый */

            routeLine =
                L.geoJSON(
                    route.geometry,
                    {
                        weight: 6
                    }
                ).addTo(map);

            /* Расстояние */

            const distanceKm =
                route.distance / 1000;

            distance.textContent =
                "📏 " +
                distanceKm.toFixed(1) +
                " км";

            /* Время */

            const minutes =
                Math.round(
                    route.duration / 60
                );

            let timeText;

            if (minutes < 60) {

                timeText =
                    minutes +
                    " мин";

            } else {

                const hours =
                    Math.floor(
                        minutes / 60
                    );

                const mins =
                    minutes % 60;

                timeText =
                    hours +
                    " ч " +
                    mins +
                    " мин";
            }

            duration.textContent =
                "🕐 " +
                timeText;

            /* Приближаем карту */

            map.fitBounds(
                routeLine.getBounds(),
                {
                    padding: [60, 60]
                }
            );

            routeButton.textContent =
                "Марш


рут построен ✓";

        } catch (error) {

            console.log(
                "Ошибка маршрута:",
                error
            );

            alert(
                "Не удалось построить маршрут."
            );

            routeButton.textContent =
                "Построить маршрут";
        }
    }
);

</script>

</body>
</html>.i
