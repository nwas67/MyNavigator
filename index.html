<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Navigator</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .search {
      position: fixed;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 9999;
    }

    #search {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 16px;
      padding: 0 18px;
      font-size: 17px;
      outline: none;
      box-shadow: 0 3px 15px rgba(0,0,0,.25);
    }

    #results {
      position: fixed;
      top: 78px;
      left: 15px;
      right: 15px;
      z-index: 9999;
    }

    .result {
      background: white;
      padding: 14px;
      margin-bottom: 6px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.2);
      font-size: 15px;
    }

    #location {
      position: fixed;
      right: 18px;
      bottom: 25px;
      z-index: 9999;
      width: 55px;
      height: 55px;
      border: 0;
      border-radius: 50%;
      background: white;
      font-size: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,.25);
    }

    #route {
      display: none;
      position: fixed;
      left: 15px;
      right: 15px;
      bottom: 20px;
      z-index: 9999;
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 3px 18px rgba(0,0,0,.25);
      font-size: 16px;
    }

    #close {
      float: right;
      border: 0;
      background: #eee;
      border-radius: 8px;
      padding: 6px 10px;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div class="search">
    <input id="search" placeholder="Куда едем?">
  </div>

  <div id="results"></div>

  <button id="location">📍</button>

  <div id="route">
    <button id="close">✕</button>
    <div id="routeText">Маршрут...</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>

    const map = L.map("map").setView(
      [55.751244, 37.618423],
      10
    );

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);

    const search = document.getElementById("search");
    const results = document.getElementById("results");
    const locationButton = document.getElementById("location");
    const routeBox = document.getElementById("route");
    const routeText = document.getElementById("routeText");
    const closeButton = document.getElementById("close");

    let timer = null;
    let userLocation = null;
    let userMarker = null;
    let destinationMarker = null;
    let routeLine = null;

    search.addEventListener("input", function () {

      clearTimeout(timer);

      const text = search.value.trim();

      if (text.length < 3) {
        results.innerHTML = "";
        return;
      }

      timer = setTimeout(async function () {

        try {

          const url =
            "https://nominatim.openstreetmap.org/search" +
            "?format=json" +
            "&limit=5" +
            "&q=" +
            encodeURIComponent(text);

          const response = await fetch(url);
          const places = await response.json();

          results.innerHTML = "";

          places.forEach(function (place) {

            const item = document.createElement("div");

            item.className = "result";
            item.textContent = place.display_name;

            item.onclick = function () {

              const lat = parseFloat(place.lat);
              const lon = parseFloat(place.lon);

              map.setView([lat, lon], 15);

              if (destinationMarker) {
                map.removeLayer(destinationMarker);
              }


destinationMarker = L.marker([lat, lon])
                .addTo(map);

              results.innerHTML = "";
              search.value = place.display_name;

              if (userLocation) {
                buildRoute(
                  userLocation.lat,
                  userLocation.lon,
                  lat,
                  lon
                );
              }

            };

            results.appendChild(item);

          });

        } catch (error) {
          console.log(error);
        }

      }, 500);

    });

    locationButton.onclick = function () {

      navigator.geolocation.getCurrentPosition(

        function (position) {

          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          userLocation = {
            lat: lat,
            lon: lon
          };

          map.setView([lat, lon], 16);

          if (userMarker) {
            map.removeLayer(userMarker);
          }

          userMarker = L.circleMarker(
            [lat, lon],
            {
              radius: 8,
              color: "white",
              weight: 3,
              fillColor: "#1976ff",
              fillOpacity: 1
            }
          ).addTo(map);

        },

        function () {
          alert("Не удалось определить местоположение");
        }

      );

    };

    async function buildRoute(
      startLat,
      startLon,
      endLat,
      endLon
    ) {

      routeBox.style.display = "block";
      routeText.textContent = "Маршрут строится...";

      if (routeLine) {
        map.removeLayer(routeLine);
      }

      try {

        const url =
          "https://router.project-osrm.org/route/v1/driving/" +
          startLon + "," + startLat +
          ";" +
          endLon + "," + endLat +
          "?overview=full&geometries=geojson";

        const response = await fetch(url);
        const data = await response.json();

        if (!data.routes || !data.routes.length) {
          routeText.textContent = "Маршрут не найден";
          return;
        }

        const route = data.routes[0];

        const distance =
          (route.distance / 1000).toFixed(1);

        const minutes =
          Math.round(route.duration / 60);

        routeText.innerHTML =
          "<b>Маршрут готов</b><
 +
          "Расстояние: " + distance + " км<
 +
          "Время: " + minutes + " мин.";

        routeLine = L.geoJSON(
          route.geometry
        ).addTo(map);

        map.fitBounds(
          routeLine.getBounds(),
          {
            padding: [60, 60]
          }
        );

      } catch (error) {

        console.log(error);
        routeText.textContent =
          "Не удалось построить маршрут";

      }

    }

    closeButton.onclick = function () {

      routeBox.style.display = "none";

      if (routeLine) {
        map.removeLayer(routeLine);
        routeLine = null;
      }

    };

  </script>

</body>
</html>
