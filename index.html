<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Navigator</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#map {
    width: 100%;
    height: 100%;
}

/* Поиск */
.search-box {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;
    z-index: 1000;
}

#search {
    width: 100%;
    box-sizing: border-box;
    padding: 16px 18px;
    border: none;
    border-radius: 18px;
    background: white;
    font-size: 17px;
    outline: none;
    box-shadow: 0 4px 18px rgba(0,0,0,0.20);
}

/* Результаты */
#results {
    position: fixed;
    top: 75px;
    left: 15px;
    right: 15px;
    z-index: 1000;
}

.result {
    padding: 14px 16px;
    margin-bottom: 7px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    font-size: 15px;
}

/* Кнопка местоположения */
.location-button {
    position: fixed;
    right: 15px;
    bottom: 25px;
    z-index: 1000;

    width: 55px;
    height: 55px;

    border: none;
    border-radius: 18px;

    background: white;
    font-size: 25px;

    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
}

.location-button:active {
    transform: scale(0.94);
}
</style>
</head>

<body>

<div id="map"></div>

<div class="search-box">
    <input
        id="search"
        type="text"
        placeholder="Куда едем?"
        autocomplete="off"
    >
</div>

<div id="results"></div>

<button
    id="locationButton"
    class="location-button"
>
    📍
</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   КАРТА
========================= */

const map = L.map("map").setView(
    [55.751244, 37.618423],
    10
);

L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);

/* =========================
   ПОИСК
========================= */

const search = document.getElementById("search");
const results = document.getElementById("results");

let marker = null;
let timer = null;

search.addEventListener("input", function () {

    clearTimeout(timer);

    const query = search.value.trim();

    if (query.length < 3) {
        results.innerHTML = "";
        return;
    }

    timer = setTimeout(async function () {

        try {

            const url =
                "https://nominatim.openstreetmap.org/search" +
                "?format=json" +
                "&limit=5" +
                "&addressdetails=1" +
                "&q=" +
                encodeURIComponent(query);

            const response = await fetch(url);

            const data = await response.json();

            results.innerHTML = "";

            data.forEach(function (place) {

                const item = document.createElement("div");

                item.className = "result";

                item.textContent = place.display_name;

                item.addEventListener("click", function () {

                    const lat = Number(place.lat);
                    const lon = Number(place.lon);

                    map.setView(
                        [lat, lon],
                        15
                    );

                    if (marker) {
                        map.removeLayer(marker);
                    }

                    marker = L.marker(
                        [lat, lon]
                    ).addTo(map);

                    marker.bindPopup(
                        place.display_name
                    ).openPopup();

                    search.value = place.display_name;

                    results.innerHTML = "";
                });

                results.appendChild(item);

            });

        } catch (error) {

            console.log(
                "Ошибка поиска:",
                error
            );

        }

    }, 500);

});

/


=========================
   ГЕОЛОКАЦИЯ
========================= */

const locationButton =
    document.getElementById("locationButton");

locationButton.addEventListener(
    "click",
    function () {

        if (!navigator.geolocation) {

            alert(
                "Твой браузер не поддерживает геолокацию."
            );

            return;
        }

        locationButton.textContent = "⏳";

        navigator.geolocation.getCurrentPosition(

            function (position) {

                const lat =
                    position.coords.latitude;

                const lon =
                    position.coords.longitude;

                map.setView(
                    [lat, lon],
                    16
                );

                if (marker) {
                    map.removeLayer(marker);
                }

                marker = L.marker(
                    [lat, lon]
                ).addTo(map);

                marker.bindPopup(
                    "📍 Вы здесь"
                ).openPopup();

                locationButton.textContent = "📍";
            },

            function (error) {

                locationButton.textContent = "📍";

                alert(
                    "Не удалось определить местоположение. Разреши доступ к геолокации для сайта."
                );

                console.log(
                    "Ошибка геолокации:",
                    error
                );
            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );

    }
);

</script>

</body>
</html>*
