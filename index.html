<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Navigator</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#map {
    width: 100%;
    height: 100%;
}

/* ПОИСК */

.search-box {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;

    height: 55px;

    background: white;
    border-radius: 18px;

    z-index: 1000;

    display: flex;
    align-items: center;

    padding: 0 18px;

    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.search-icon {
    font-size: 21px;
    margin-right: 10px;
}

#search {
    width: 100%;
    height: 100%;

    border: none;
    outline: none;

    font-size: 17px;
}

/* РЕЗУЛЬТАТЫ */

#results {
    position: fixed;

    top: 78px;
    left: 15px;
    right: 15px;

    z-index: 1001;

    background: white;

    border-radius: 18px;

    overflow: hidden;

    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.result {
    padding: 15px;

    border-bottom: 1px solid #eeeeee;

    font-size: 15px;

    cursor: pointer;
}

.result:last-child {
    border-bottom: none;
}

.result:active {
    background: #eeeeee;
}
</style>
</head>

<body>

<!-- КАРТА -->

<div id="map"></div>

<!-- ПОИСК -->

<div class="search-box">

    <div class="search-icon">🔎</div>

    <input
        id="search"
        type="text"
        placeholder="Куда едем?"
        autocomplete="off"
    >

</div>

<!-- РЕЗУЛЬТАТЫ -->

<div id="results"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   КАРТА
========================= */

const map = L.map("map").setView(
    [55.751244, 37.618423],
    10
);

L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution:
            "&copy; OpenStreetMap contributors"
    }
).addTo(map);

/* =========================
   ЭЛЕМЕНТЫ
========================= */

const search =
    document.getElementById("search");

const results =
    document.getElementById("results");

let marker = null;

let timer = null;

/* =========================
   ПОИСК
========================= */

search.addEventListener(
    "input",
    function() {

        clearTimeout(timer);

        const query =
            search.value.trim();

        results.innerHTML = "";

        if (query.length < 3) {
            return;
        }

        timer = setTimeout(
            function() {
                findPlaces(query);
            },
            600
        );

    }
);

/* =========================
   NOMINATIM
========================= */

async function findPlaces(query) {

    results.innerHTML =
        '<div class="result">Ищем...</div>';

    try {

        const url =
            "https://nominatim.openstreetmap.org/search" +
            "?format=json" +
            "&limit=5" +
            "&accept-language=ru" +
            "&q=" +
            encodeURIComponent(query);

        const response =
            await fetch(url);

        const places =
            await response.json();

        results.innerHTML = "";

        if (places.length === 0) {

            results.innerHTML =
                '<div class="result">Ничего не найдено</div>';

            return;
        }

        places.forEach(
            function(place) {

                const item =
                    document.createElement("div");

                item.className = "result";

                item.textContent =
                    place.display_name;

                item.onclick =
                    function() {

                        const lat =
                            Number(place.lat);

                        const lon =
                            Number(place.lon);

                        map.setView(
                            [lat, lon],
                            16
                        );

                        if (marker) {


map.removeLayer(marker);
                        }

                        marker =
                            L.marker([lat, lon])
                            .addTo(map)
                            .bindPopup(
                                place.display_name
                            )
                            .openPopup();

                        results.innerHTML = "";

                    };

                results.appendChild(item);

            }
        );

    }

    catch (error) {

        console.error(error);

        results.innerHTML =
            '<div class="result">Ошибка поиска</div>';

    }

}

</script>

</body>
</html>
