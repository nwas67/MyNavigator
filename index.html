<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Navigator</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                         "SF Pro Text", Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Верхняя панель */

        .top-panel {
            position: absolute;
            top: 18px;
            left: 15px;
            right: 15px;
            z-index: 1000;
        }

        .search-box {
            height: 58px;
            display: flex;
            align-items: center;
            padding: 0 18px;

            background: rgba(255, 255, 255, 0.94);
            border-radius: 20px;

            box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.18);
        }

        .search-icon {
            font-size: 23px;
            margin-right: 12px;
        }

        .search-text {
            font-size: 18px;
            color: #777;
        }

        /* Кнопка геолокации */

        #locationBtn {
            position: absolute;
            z-index: 1000;

            right: 18px;
            bottom: 135px;

            width: 56px;
            height: 56px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.96);

            font-size: 25px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.22);

            cursor: pointer;
        }

        #locationBtn:active {
            transform: scale(0.94);
        }

        /* Нижняя панель */

        .bottom-panel {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 12px;

            z-index: 1000;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 24px;

            padding: 15px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.2);
        }

        .panel-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .quick-buttons {
            display: flex;
            gap: 10px;
        }

        .quick-button {
            flex: 1;

            height: 55px;

            border: none;
            border-radius: 17px;

            background: #f2f2f2;

            font-size: 15px;
            font-weight: 500;

            cursor: pointer;
        }

        .quick-button:active {
            transform: scale(0.97);
        }

        /* Убираем стандартные кнопки Leaflet */

        .leaflet-control-zoom {
            display: none;
        }

        .leaflet-control-attribution {
            font-size: 9px;
        }
    </style>
</head>

<body>

<div id="map"></div>

<!-- Верх -->

<div class="top-panel">
    <div class="search-box">
        <div class="search-icon">🔍</div>
        <div class="search-text">Куда едем?</div>
    </div>
</div>

<!-- Геолокация -->

<button id="locationBtn">📍</button>

<!-- Низ -->

<div class="bottom-panel">

    <div class="panel-title">
        Быстрый доступ
    </div>

    <div class="quick-buttons">

        <button class="quick-button">
            🏠<br
          Дом
        </button>

        <button class="quick-button">
            ⭐<br
          Избранное
        </button>

        <button class="quick-button">
            🕘

         История
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    /* Создаём карту */

    const map = L.map('map').setView(
        [55.751244, 37.618423],
        10
    );

    /* Загружаем карту */

    L.tileLayer(


tps://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);

    /* Геолокация */

    let userMarker = null;

    document
        .getElementById('locationBtn')
        .addEventListener('click', function () {

            if (!navigator.geolocation) {
                alert('Геолокация не поддерживается');
                return;
            }

            navigator.geolocation.getCurrentPosition(

                function (position) {

                    const lat =
                        position.coords.latitude;

                    const lon =
                        position.coords.longitude;

                    if (userMarker) {

                        userMarker.setLatLng([
                            lat,
                            lon
                        ]);

                    } else {

                        userMarker =
                            L.marker([
                                lat,
                                lon
                            ]).addTo(map);

                        userMarker
                            .bindPopup('Вы здесь')
                            .openPopup();
                    }

                    map.setView(
                        [lat, lon],
                        16
                    );
                },

                function () {

                    alert(
                        'Не удалось определить местоположение'
                    );

                }

            );

        });

</script>

</body>
</html>'ht
