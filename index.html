========================= */

function findLocation() {

    if (!navigator.geolocation) {

        alert(
            'Геолокация не поддерживается'
        );

        return;
    }

    navigator.geolocation.getCurrentPosition(

        position => {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;

            currentLocation = {
                lat: lat,
                lon: lon
            };

            map.setView(
                [lat, lon],
                16
            );

            if (marker) {
                map.removeLayer(marker);
            }

            marker =
                L.marker([lat, lon])
                .addTo(map)
                .bindPopup(
                    'Вы здесь'
                )
                .openPopup();

            map.invalidateSize(true);

        },

        () => {

            alert(
                'Не удалось определить местоположение'
            );

        }

    );
}

async function buildRoute() {

    if (!destination) {

        alert(
            'Сначала выберите место'
        );

        return;
    }

    if (!currentLocation) {

        if (!navigator.geolocation) {

            alert(
                'Геолокация не поддерживается'
            );

            return;
        }

        navigator.geolocation.getCurrentPosition(

            position => {

                currentLocation = {

                        position.coords.latitude,

                    lon:
                        position.coords.longitude

                };

                buildRoute();

    const button =
        document.getElementById(
            'routeButton'
        );

    button.textContent =
        '⏳ Строим маршрут...';

    button.disabled = true;

    try {

        const start =
            `${currentLocation.lon},${currentLocation.lat}`;

        const end =
            `${destination.lon},${destination.lat}`;

        const url =
            `https://router.project-osrm.org/route/v1/driving/${start};${end}?overview=full&geometries=geojson`;

        const response =
            await fetch(url);

        const data =
            await response.json();

        if (
            !data.routes ||
            !data.routes.length
        ) {

            throw new Error(
                'Маршрут не найден'
            );

        }

        const route =
            data.routes[0];

        if (routeLine) {

            map.removeLayer(
                routeLine
            );

        }

        routeLine =
            L.geoJSON(
                route.geometry,
                {
                    weight: 6,
                    opacity: 0.9
                }
            ).addTo(map);

        map.fitBounds(
            routeLine.getBounds(),
            {
                padding: [50, 220]
            }
        );

        const minutes =
            Math.round(
                route.duration / 60
            );

        const km =
            (
                route.distance / 1000
            ).toFixed(1);

        document
            .getElementById(
                'routeTime'
            )
            .textContent =
                minutes < 60
                ? `${minutes} мин`
                : `${Math.floor(minutes / 60)} ч ${minutes % 60} мин`;

        document
            .getElementById(
                'routeDistance'
            )
            .textContent =
                `${km} км • на автомобиле`;

        document
            .getElementById(
                'routeInfo'
            )
            .style.display =
                'block';

        button.textContent =
            '🚗 Маршрут построен';

    } catch (error) {

        console.log(
            'Ошибка маршрута:',
            error
        );

        alert(
            'Не удалось построить маршрут'
        );

        button.textContent =
            '🚗 Построить маршрут';

    }

    button.disabled = false;

}
